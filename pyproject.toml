[project]
name = "agentic-graphrag-rl-trainer"
version = "0.1.0"
description = "Agentic GraphRAG system with RL fine-tuning for function calling on Qwen3-8B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.51.0", # Required for Qwen3 support
    "trl>=0.8.0", # HuggingFace TRL for RL training
    "peft>=0.10.0", # PEFT for LoRA/QLoRA
    "bitsandbytes>=0.43.0", # 4-bit quantization
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git", # Unsloth optimization
    "datasets>=2.18.0", # HuggingFace datasets
    "accelerate>=0.27.0", # Multi-GPU training
    "hydra-core>=1.3.0", # Configuration management
    "omegaconf>=2.3.0", # Config composition
    "wandb>=0.16.0", # Experiment tracking
    "jsonschema>=4.21.0", # JSON schema validation for type checking
    "tensorboard>=2.16.0", # Training visualization
    "scipy>=1.10.0", # For Hungarian algorithm in multi-call matching
    "numpy>=1.24.0", # Required by scipy and general numerical operations
    "torchvision>=0.24.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "ipython>=8.22.0",
    "jupyter>=1.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]

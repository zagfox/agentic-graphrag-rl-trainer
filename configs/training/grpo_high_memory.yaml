# @package training

# High Memory Configuration for 32GB+ RAM systems
# Optimized for: RTX 4070 (12GB VRAM) + 32GB+ System RAM
# Expected RAM usage: ~16-20 GB
# Faster training with larger batches

algorithm: "grpo"

sft_warmstart:
  enabled: true
  num_epochs: 3
  batch_size: 4
  learning_rate: 2.0e-5
  gradient_accumulation_steps: 4
  warmup_steps: 100

ppo:
  learning_rate: 1.41e-5
  num_ppo_epochs: 4
  mini_batch_size: 1
  batch_size: 4  # Full batch size
  gradient_accumulation_steps: 4
  num_generations: 4  # Full 4 generations per prompt

  ppo_params:
    init_kl_coef: 0.2
    target: 6.0
    adap_kl_ctrl: true
    gamma: 1.0
    lam: 0.95
    cliprange: 0.2
    cliprange_value: 0.2
    vf_coef: 0.1

optimization:
  optimizer: "adamw_torch_fused"
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 100

schedule:
  total_steps: 10000
  eval_steps: 500
  save_steps: 500  # More frequent saves
  logging_steps: 10

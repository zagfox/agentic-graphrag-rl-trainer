# @package training

# Low Memory Configuration for 16GB RAM systems
# Optimized for: RTX 4070 (12GB VRAM) + 16GB System RAM
# Expected RAM usage: ~8-10 GB

algorithm: "grpo"

sft_warmstart:
  enabled: true  # Recommended for stability
  num_epochs: 2  # Reduced from 3
  batch_size: 2  # Reduced from 4
  learning_rate: 2.0e-5
  gradient_accumulation_steps: 4
  warmup_steps: 100

ppo:  # Named ppo for backward compatibility, but using GRPO
  learning_rate: 1.41e-5
  num_ppo_epochs: 4
  mini_batch_size: 1
  batch_size: 2  # Reduced from 4
  gradient_accumulation_steps: 4  # Effective batch = 8
  num_generations: 2  # CRITICAL: Reduced from 4 (saves 50% memory)

  ppo_params:
    init_kl_coef: 0.2
    target: 6.0
    adap_kl_ctrl: true
    gamma: 1.0
    lam: 0.95
    cliprange: 0.2
    cliprange_value: 0.2
    vf_coef: 0.1

optimization:
  optimizer: "adamw_torch_fused"
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 100

schedule:
  total_steps: 10000
  eval_steps: 500
  save_steps: 1000
  logging_steps: 10
